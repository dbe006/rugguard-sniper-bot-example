[project]
name = "rugguard-sniper-bot-example"
version = "0.1.3"
description = "Educational Base sniper bot demonstrating RugGuard pre-trade safety integration. Not production-grade."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "David Bellaiche" },
]
keywords = [
    "rugguard",
    "sniper",
    "bot",
    "x402",
    "trading",
    "crypto",
    "base",
    "pre-trade",
    "safety",
    "example",
    "educational",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    # x402 signing path
    "eth-account>=0.13,<1.0",
    "httpx>=0.28,<1.0",
    # Typed result models
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.6,<1.0",
]
# In-band Ed25519 signature verification on /v1/pretrade/check responses.
# Opt-in via --verify CLI flag or `evaluate_candidate(..., verify=True)`.
# Install: pip install "rugguard-sniper-bot-example[verify]"
verify = ["rugguard-verify>=0.1.1,<1.0"]

[project.urls]
Homepage = "https://rugguard.redfleet.fr"
Repository = "https://github.com/dbe006/rugguard-sniper-bot-example"
Issues = "https://github.com/dbe006/rugguard-sniper-bot-example/issues"
"RugGuard API" = "https://rugguard.redfleet.fr/openapi.json"
"Pydantic AI variant" = "https://pypi.org/project/rugguard-pydantic-ai-agent/"
"LangGraph variant" = "https://pypi.org/project/rugguard-langgraph-agent/"

[project.scripts]
rugguard-sniper = "rugguard_sniper_bot.bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
